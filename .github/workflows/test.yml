name: Otaku Hub API Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ck_test_user
          POSTGRES_PASSWORD: cck_test_pass_123
          POSTGRES_DB: ckkk_test_db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck_test_user -d ckkk_test_db_name"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        env:
          DB_URL: postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from database import Base, engine; Base.metadata.create_all(engine)"

      - name: Initialize database
        env:
         DB_URL: postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name
         PYTHONPATH: ${{ github.workspace }}
        run: |
         python << 'EOF'
         import sys
         import time
         from sqlalchemy import create_engine, text
        
         max_retries = 10
         retry_count = 0
        
         while retry_count < max_retries:
            try:
                engine = create_engine("postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name")
                with engine.connect() as conn:
                    conn.execute(text("SELECT 1"))
                    conn.commit()
                break
            except Exception as e:
                retry_count += 1
                if retry_count >= max_retries:
                    print(f"Failed to connect to database after {max_retries} attempts")
                    sys.exit(1)
                time.sleep(2)
        
         try:
            from database import Base, engine as db_engine
            Base.metadata.create_all(db_engine)
            print("Database tables created successfully")
         except Exception as e:
            print(f"Error creating tables: {e}")
            sys.exit(1)
         EOF