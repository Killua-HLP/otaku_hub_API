name: Otaku Hub API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ck_test_user
          POSTGRES_PASSWORD: cck_test_pass_123
          POSTGRES_DB: ckkk_test_db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck_test_user -d ckkk_test_db_name"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_URL: postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name
          SECRET_KEY: ${{ secrets.MY_THIRD_PARTY_TEST_KEY }}
        run: |
          echo "SECRET_KEY=${{ secrets.MY_THIRD_PARTY_TEST_KEY }}" > .env
          echo "DB_URL=postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name" >> .env
          
          echo "SECRET_KEY=${{ secrets.MY_THIRD_PARTY_TEST_KEY }}" > .env
          echo "DB_URL=postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name" >> .env
          
          pytest tests/ -v