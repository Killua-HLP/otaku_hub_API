name: Otaku Hub API Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ck_test_user
          POSTGRES_PASSWORD: cck_test_pass_123
          POSTGRES_DB: ckkk_test_db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck_test_user -d ckkk_test_db_name"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests suite with pytest
        env:
          SECRET_KEY: "super-secret-test-key-for-ci-pipeline"
          DB_USER: "ck_test_user"
          DB_PASSWORD: "cck_test_pass_123"
          DB_NAME: "ckkk_test_db_name"
          DB_URL: postgresql://ck_test_user:cck_test_pass_123@localhost:5432/ckkk_test_db_name
        run: |
          pytest tests/ -v