services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: killuahlp
      POSTGRES_PASSWORD: 624203
      POSTGRES_DB: otaku_hub
    ports:
      - "9746:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killuahlp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: